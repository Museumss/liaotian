<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服聊天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{max-width:620px;margin:12px auto;padding:10px;}
#msgWrap{height:65vh;border:1px solid #e5e7eb;border-radius:10px;padding:10px;overflow-y:auto;margin-bottom:12px;background:#fafafa;}
.msg{padding:7px 12px;border-radius:8px;margin:5px 0;max-width:75%;word-break:break-all;}
.self{background:#2563eb;color:#fff;margin-left:auto;}
.other{background:#e4e4e7;color:#18181b;}
.ctrl{display:flex;gap:8px}
#txt{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;outline:none}
#sendBtn{padding:0 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="msgWrap"></div>
<div class="ctrl">
  <input id="txt" placeholder="输入消息...">
  <button id="sendBtn">发送</button>
</div>
<script>
// ==========这里改成你自己的worker地址==========
const WS_URL = "wss:https://liaotian.jiujinshang.workers.dev";
const msgBox = document.getElementById("msgWrap");
const input = document.getElementById("txt");
const sendBtn = document.getElementById("sendBtn");

let ws;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onmessage = e => {
    const div = document.createElement("div");
    div.className = "msg other";
    div.innerText = e.data;
    msgBox.appendChild(div);
    msgBox.scrollTop = msgBox.scrollHeight;
  }
  ws.onclose = () => {
    setTimeout(connect, 2000); // 自动重连
  }
}
connect();

function sendMsg() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(text);
  const div = document.createElement("div");
  div.className = "msg self";
  div.innerText = text;
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
  input.value = "";
}
sendBtn.onclick = sendMsg;
input.onkeydown = e => e.key === "Enter" && sendMsg();
</script>
</body>
</html>
